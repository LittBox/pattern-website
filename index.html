<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>云南少数民族纹样文创平台 | 纹样·传承·创新</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background-color: #FEF9F0; color: #2C2418; line-height: 1.5; }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
    .navbar { position: sticky; top: 0; z-index: 1000; background: rgba(255, 251, 245, 0.96); backdrop-filter: blur(12px); border-bottom: 1px solid #F0E2D2; padding: 12px 0; }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
    .logo { font-size: 1.5rem; font-weight: 700; background: linear-gradient(135deg, #B45F2B, #DA7E3C); background-clip: text; -webkit-background-clip: text; color: transparent; letter-spacing: -0.3px; cursor: pointer; }
    .nav-links { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
    .nav-links a { text-decoration: none; color: #4A3727; font-weight: 500; transition: 0.2s; font-size: 0.95rem; cursor: pointer; }
    .nav-links a:hover { color: #C26E2C; }
    .search-area { display: flex; gap: 12px; align-items: center; }
    .search-box { background: white; border: 1px solid #EBDCCB; border-radius: 40px; padding: 6px 16px; display: flex; align-items: center; gap: 8px; }
    .search-box input { border: none; background: transparent; outline: none; width: 190px; font-size: 0.85rem; }
    .btn-primary { background: #C26E2C; border: none; padding: 8px 24px; border-radius: 40px; color: white; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary:hover { background: #A95E24; }
    .btn-outline { background: transparent; border: 1px solid #C26E2C; padding: 6px 20px; border-radius: 40px; color: #C26E2C; font-weight: 500; cursor: pointer; }
    .btn-outline:hover { background: #FFF2E6; }
    .hero { background: radial-gradient(circle at 10% 30%, #F8EADB, #F2DECB); border-radius: 40px; margin: 28px 0 48px; padding: 56px 48px; position: relative; overflow: hidden; }
    .hero::after { content: "☁️✨"; font-size: 140px; position: absolute; bottom: -20px; right: 0; opacity: 0.1; pointer-events: none; }
    .card { background: white; border-radius: 24px; overflow: hidden; transition: transform 0.25s ease, box-shadow 0.25s; box-shadow: 0 6px 14px rgba(0, 0, 0, 0.02); cursor: pointer; }
    .card:hover { transform: translateY(-6px); box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.1); }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 28px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
    .section-title { margin: 44px 0 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid #F0E2D2; padding-bottom: 10px; }
    .section-title h2, .section-title h3 { font-size: 1.45rem; }
    .tag { background: #F0E2D2; padding: 4px 10px; border-radius: 40px; font-size: 12px; display: inline-block; margin: 4px 4px 0 0; }
    select { border: 1px solid #EBDCCB; border-radius: 40px; padding: 8px 14px; background: white; color: #4A3727; outline: none; }
    img { display: block; }
    .footer { background: #2C2418; color: #CFC5B6; padding: 48px 0 32px; margin-top: 70px; }
    .footer a { color: #CFC5B6; text-decoration: none; cursor: pointer; }
    .footer a:hover { color: #E6C8A8; }
    .toast-msg { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #2C2418; color: white; padding: 10px 24px; border-radius: 60px; z-index: 2000; font-size: 0.85rem; font-weight: 500; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.65); justify-content: center; align-items: center; z-index: 1200; }
    .modal-content { background: #FFFEF9; max-width: 480px; width: 90%; border-radius: 32px; padding: 32px; }
    .drawer { position: fixed; top: 0; right: -460px; width: 440px; height: 100%; background: white; box-shadow: -4px 0 20px rgba(0, 0, 0, 0.1); z-index: 1300; transition: right 0.3s ease; padding: 24px; overflow-y: auto; }
    .drawer.open { right: 0; }
    .overlay-blur { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(3px); z-index: 1250; display: none; }
    .saved-preview-card, .cart-row { display: flex; gap: 12px; background: #F8F0E7; border-radius: 18px; padding: 10px; margin-bottom: 10px; align-items: center; }
    .saved-preview-card img, .cart-row img { width: 72px; height: 72px; object-fit: cover; border-radius: 14px; }
    .empty-box { background: #F8F0E7; border-radius: 24px; padding: 28px; text-align: center; color: #8A7159; }
    @media (max-width: 768px) { .drawer { width: 90%; right: -90%; } .hero { padding: 32px 24px; } .grid-4, .grid-3 { gap: 16px; } .nav-links { gap: 16px; } .search-box input { width: 120px; } }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="container nav-inner">
      <div class="logo" id="logoHome">🎨 云纹·云南纹样文创平台</div>
      <div class="nav-links" id="navLinks">
        <a data-nav="home">首页</a>

  <main id="appContent"></main>

  <div class="footer">
    <div class="container">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 24px;">
        <div>© 2025 云南纹样文创平台 | 云南少数民族文化保护与发展项目</div>
        <div style="display: flex; gap: 24px; flex-wrap: wrap;">
          <a id="footerAbout">关于我们</a>
          <a id="footerLicense">纹样授权协议</a>
          <a id="footerJoin">加入我们</a>

        </div>

  </div>

  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h3>登录 · 体验完整创意生态</h3>
      <p style="margin: 14px 0;">手机号快捷登录（模拟）</p>
      <input type="text" id="phoneInput" placeholder="手机号" style="width:100%; padding:12px; border-radius:40px; border:1px solid #ddd; margin-bottom:16px;">
      <button id="confirmLogin" class="btn-primary" style="width:100%">登录 / 注册</button>
      <button id="closeModal" style="margin-top:16px; background:none; border:none; cursor:pointer; width:100%;">关闭</button>
    </div>
  </div>

  <div id="trialDrawer" class="drawer">
    <h3>🎨 文创应用预览</h3>
    <button id="closeDrawer" style="float:right; background:none; border:none; font-size:28px; cursor:pointer;">&times;</button>
    <div style="margin-top: 40px;">
      <p style="color:#6B5642; margin-bottom:16px;">选择一个民族纹样，将其应用到文创产品上，预览传统纹样在现代设计中的转化效果。</p>
      <label>选择产品载体：</label>
      <div style="display:flex; gap:12px; margin:12px 0; flex-wrap:wrap;">
        <button class="btn-outline product-template" data-product="T恤">T恤</button>
        <button class="btn-outline product-template" data-product="帆布袋">帆布袋</button>
        <button class="btn-outline product-template" data-product="手机壳">手机壳</button>
        <button class="btn-outline product-template" data-product="围巾">围巾</button>
        <button class="btn-outline product-template" data-product="书签">书签</button>
      </div>
      <div style="margin:16px 0;">
        <p>纹样控制：缩放 / 旋转 / 拖拽（当前为展示模拟）</p>
        <button id="renderMockupBtn" class="btn-primary" style="width:100%; margin-top:10px;">生成预览效果</button>
      </div>
      <div id="previewContainer" style="background:#F3EEE7; border-radius:24px; min-height:220px; display:flex; align-items:center; justify-content:center; padding:16px;">
        <span style="color:#A58461;">选择纹样和载体后点击生成预览效果</span>
      </div>
      <div style="display:flex; gap:10px; margin-top:12px;">
        <button id="savePreviewBtn" class="btn-primary" style="flex:1;">保存当前预览</button>
        <button id="clearPreviewBtn" class="btn-outline" style="flex:1;">清空预览</button>
      </div>
      <div class="section-title" style="margin-top:28px;">
        <h3>已保存预览</h3>
      </div>
      <div id="savedPreviewList"></div>
    </div>
  </div>

  <div id="drawerOverlay" class="overlay-blur"></div>

  <script>
    let currentUser = null;
    let currentPage = "home";
    let currentDrawerPattern = null;
    let currentTemplate = "T恤";
    let currentGeneratedPreview = null;
    const FALLBACK_IMAGE = "./img/白族/baizu (1).jpg";
    let savedPreviews = JSON.parse(localStorage.getItem("savedPreviews") || "[]");
    let cartItems = JSON.parse(localStorage.getItem("cartItems") || "[]");

    // 民族基本信息（保留文化介绍）
    const ethnicGroups = [
      { id: "wa", name: "佤族", intro: "通天木鼓、司岗里史诗、几何神谕", culture: "佤族核心纹样包括菱形回纹、倒三角连续纹、牛角纹，常见于木鼓房、寨桩、女神桩和长刀刀鞘。" },
      { id: "pumi", name: "普米族", intro: "白狼传说、三江并流、白海螺纹", culture: "普米族纹样记录迁徙史与自然崇拜，白海螺纹象征和平、法音与灵魂回归祖源。" },
      { id: "nu", name: "怒族", intro: "怒江峡谷、岩壁石穴、蜂窝纹", culture: "怒族纹样源于怒江岩壁、洞穴和蜂巢结构，强调直线框架、点状填充和水流生命力。" },
      { id: "naxi", name: "纳西族", intro: "东巴文化、五行八方、蛙形纹", culture: "纳西族蛙纹浓缩东巴宇宙观，象征生命本源、方位秩序、历法推算与祭祀占卜。" },
      { id: "lisu", name: "傈僳族", intro: "三色火塘、弩弓传说、贝壳缀纹", culture: "傈僳族弩弓纹象征男性力量与家庭守护，红白黑三色承载火塘、泉水与土地记忆。" },
      { id: "lahu", name: "拉祜族", intro: "葫芦孕人、创世史诗、长刀纹", culture: "拉祜族葫芦纹源于《牡帕密帕》，象征母体子宫、庇护所、再生和族源神话。" },
      { id: "jingpo", name: "景颇族", intro: "目瑙纵歌、彩虹雷公纹、迁徙史诗", culture: "景颇族织锦纹样如图画象形文字，记录迁徙路线、舞步秩序与天地连接。" },
      { id: "jinuo", name: "基诺族", intro: "太阳鼓、阿嫫腰白、八角太阳花", culture: "基诺族太阳花纹源于太阳鼓崇拜，象征希望指引、母体庇护和民族图腾。" },
      { id: "hani", name: "哈尼族", intro: "哀牢山梯田、白鹇鸟、鱼纹", culture: "哈尼族纹样将农耕文明编织在身上，梯田纹象征水源、土地秩序与族群延续。" },
      { id: "dulong", name: "独龙族", intro: "蝴蝶文面、怒江峡谷、菱形网纹", culture: "独龙族蝴蝶纹与文面传统相关，象征先灵、灵魂通道、成年礼和自然回归。" },
      { id: "deang", name: "德昂族", intro: "古老茶农、茶树叶纹、腰箍纹", culture: "德昂族茶树叶纹与茶祖神话相关，藤篾腰箍纹象征美、约束和身份转变。" },
      { id: "dai", name: "傣族", intro: "水波灵动、金孔雀、贝叶经", culture: "傣族纹样受南传佛教与稻作文明影响，水波纹、孔雀翎眼纹象征净化、吉祥和智慧。" },
      { id: "bulang", name: "布朗族", intro: "山茶花、酸茶遗存、锯齿纹", culture: "布朗族作为云南早期种茶民族之一，纹样质朴，强调茶山劳作、阴阳平衡和祖先灵魂。" },
      { id: "bai", name: "白族", intro: "苍洱风花雪月、甲马扎染、蝴蝶纹", culture: "白族纹样源于南诏大理文化和扎染工艺，强调青白色调、风花雪月与建筑审美。" },
      { id: "achang", name: "阿昌族", intro: "户撒刀、菌子纹、双钩藤纹", culture: "阿昌族纹样与制刀、冶铁和农耕相关，菌子纹象征雨后生命力与生生不息。" }
    ];

    // 动态生成所有图片路径（完整覆盖你提供的目录结构）
    function buildAllImages() {
      const imgBase = "./img/";
      const images = {};

      // 连续编号且格式单一的民族（循环生成）
      images["傣族"] = Array.from({length: 73}, (_, i) => `daizu (${i+1}).jpg`);
      images["白族"] = Array.from({length: 91}, (_, i) => `baizu (${i+1}).jpg`);
      images["基诺族"] = Array.from({length: 18}, (_, i) => `jinuozu (${i+1}).jpg`);
      images["阿昌族"] = Array.from({length: 16}, (_, i) => `achangzu (${i+1}).jpg`);
      images["纳西族"] = Array.from({length: 11}, (_, i) => `naxizu (${i+1}).png`);
      images["独龙族"] = Array.from({length: 30}, (_, i) => `dulongzu (${i+1}).jpg`);
      images["傈僳族"] = Array.from({length: 24}, (_, i) => `lisuzu (${i+1}).jpg`);
      images["哈尼族"] = Array.from({length: 26}, (_, i) => `hanizu (${i+1}).jpg`);
      images["景颇族"] = Array.from({length: 36}, (_, i) => `jingpozu (${i+1}).jpg`);
      images["怒族"] = Array.from({length: 7}, (_, i) => `nuzu (${i+1}).jpg`);
      images["拉祜族"] = Array.from({length: 22}, (_, i) => `lahuzu (${i+1}).jpg`);
      images["布朗族"] = Array.from({length: 27}, (_, i) => `bulangzu (${i+1}).jpg`);
      images["普米族"] = Array.from({length: 27}, (_, i) => `pumizu (${i+1}).png`);

      // 混合格式或非连续编号的民族（手动列举）
      images["佤族"] = [
        "wazu (1).jpg", "wazu (1).png", "wazu (2).jpg", "wazu (2).png",
        "wazu (3).jpg", "wazu (3).png", "wazu (4).jpg", "wazu (4).png",
        "wazu (5).jpg", "wazu (5).png", "wazu (6).jpg", "wazu (6).png",
        "wazu (7).jpg", "wazu (7).png", "wazu (8).jpg", "wazu (8).png",
        "wazu (9).jpg", "wazu (9).png", "wazu (10).jpg", "wazu (10).png",
        "wazu (11).jpg", "wazu (11).png", "wazu (12).jpg", "wazu (12).png",
        "wazu (13).jpg", "wazu (13).png", "wazu (14).jpg", "wazu (14).png",
        "wazu (15).jpg", "wazu (15).png", "wazu (16).jpg", "wazu (16).png",
        "wazu (17).jpg", "wazu (17).png", "wazu (18).jpg", "wazu (18).png",
        "wazu (19).jpg", "wazu (19).png", "wazu (20).png"
      ];

      images["德昂族"] = [
        "deangzu (1).jpg", "deangzu (1).png", "deangzu (2).jpg", "deangzu (2).png",
        "deangzu (3).jpg", "deangzu (3).png", "deangzu (4).jpg", "deangzu (4).png",
        "deangzu (5).jpg", "deangzu (5).png", "deangzu (6).jpg", "deangzu (6).png",
        "deangzu (7).jpg", "deangzu (7).png", "deangzu (8).jpg", "deangzu (8).png",
        "deangzu (9).jpg", "deangzu (9).png", "deangzu (10).jpg", "deangzu (10).png",
        "deangzu (11).jpg", "deangzu (11).png", "deangzu (12).jpg", "deangzu (12).png",
        "deangzu (13).jpg", "deangzu (13).png", "deangzu (14).png", "deangzu (15).png",
        "deangzu (16).png", "deangzu (17).png"
      ];

      return images;
    }

    const allNationImages = buildAllImages();

    // 根据文件名简单推断纹样类型
    function inferPatternType(filename) {
      const lower = filename.toLowerCase();
      if (/鸟|鱼|蝴蝶|孔雀/.test(lower)) return "动物纹样";
      if (/花|茶|菌|藤/.test(lower)) return "植物纹样";
      if (/水|云|梯田|日|月|太阳/.test(lower)) return "自然纹样";
      if (/弩|刀|鼓|腰箍/.test(lower)) return "器物纹样";
      if (/蛙|葫芦|图/.test(lower)) return "图腾纹样";
      return "几何纹样";
    }

    // 生成全部纹样数据（每张图片一个对象）
    let mockPatterns = [];
    let patternIdCounter = 1;
    ethnicGroups.forEach(group => {
      const nation = group.name;
      const files = allNationImages[nation] || [];
      files.forEach(file => {
        const filePath = `./img/${nation}/${file}`;
        // 从文件名提取编号用于显示
        const match = file.match(/\((\d+)\)/);
        const num = match ? match[1] : '';
        const name = `${nation}·图案 ${num}`;
        mockPatterns.push({
          id: patternIdCounter++,
          name: name,
          nation: nation,
          nationId: group.id,
          likes: Math.floor(150 + Math.random() * 400),
          img: filePath,
          large: filePath,
          type: inferPatternType(file),
          priceType: "展示",
          desc: `${name} 是${nation}传统纹样的一部分。${group.culture}`,
          culture: group.culture
        });
      });
    });

    // 产品数据保持不变
    let products = [
      { id: 101, name: "佤族木鼓纹帆布袋", nation: "佤族", price: 89, sales: 520, img: "./img/佤族/wazu (3).jpg", patternRef: "菱形回纹" },
      { id: 102, name: "普米族白海螺纹丝巾", nation: "普米族", price: 128, sales: 335, img: "./img/普米族/pumizu (3).png", patternRef: "白海螺纹" },
      { id: 103, name: "纳西东巴蛙纹文创本", nation: "纳西族", price: 49, sales: 198, img: "./img/纳西族/naxizu (3).png", patternRef: "蛙形纹" },
      { id: 104, name: "傣族水波孔雀纹茶席", nation: "傣族", price: 168, sales: 112, img: "./img/傣族/daizu (3).jpg", patternRef: "水波纹" },
      { id: 105, name: "白族风花雪月纹扎染方巾", nation: "白族", price: 98, sales: 289, img: "./img/白族/baizu (3).jpg", patternRef: "风花雪月纹" },
      { id: 106, name: "哈尼梯田纹手机壳", nation: "哈尼族", price: 59, sales: 430, img: "./img/哈尼族/hanizu (3).jpg", patternRef: "梯田纹" }
    ];

    // 以下所有函数保持不变（navigateTo, renderHome 等）
    function saveLocalData() {
      localStorage.setItem("savedPreviews", JSON.stringify(savedPreviews));
      localStorage.setItem("cartItems", JSON.stringify(cartItems));
    }

    function showToast(msg) {
      let t = document.createElement("div");
      t.className = "toast-msg";
      t.innerText = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2200);
    }

    function checkAuth(needUser = true) {
      if (!currentUser && needUser) {
        showToast("请先登录后操作，解锁完整权限");
        document.getElementById("loginModal").style.display = "flex";
        return false;
      }

      if (!container) return;
      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-box">暂无符合条件的纹样</div>`;

      container.innerHTML = Object.keys(grouped).map(nationName => {

    window.openTrialDrawer = function(patternId) {
      if (patternId) {
        const p = mockPatterns.find(pp => pp.id === patternId);
        if (p) currentDrawerPattern = p;
        showToast(`当前选择纹样：${p?.name || "未选择纹样"}`);
      } else {
        currentDrawerPattern = mockPatterns[0];
      }
      currentGeneratedPreview = null;
      document.getElementById("trialDrawer").classList.add("open");
      document.getElementById("drawerOverlay").style.display = "block";
      renderSavedPreviewList();
    };

    function closeDrawer() {
      document.getElementById("trialDrawer").classList.remove("open");
      document.getElementById("drawerOverlay").style.display = "none";
    }

    function generateEffect() {
      const pattern = currentDrawerPattern || mockPatterns[0];
      const previewImg = pattern.large || pattern.img;
      currentGeneratedPreview = {
        id: Date.now(),
        patternId: pattern.id,
        patternName: pattern.name,
        nation: pattern.nation,
        template: currentTemplate,
        img: previewImg,
        createdAt: new Date().toLocaleString()
      };
      const container = document.getElementById("previewContainer");
      container.innerHTML = `
        <div style="text-align:center; width:100%;">
          <img src="${previewImg}" style="border-radius:16px; width:100%; max-height:170px; object-fit:cover;" onerror="this.src='${FALLBACK_IMAGE}'" >
          <p style="margin-top:8px;">✨ “${pattern.name}” 应用于 ${currentTemplate}</p>
          <p style="font-size:12px; color:#8A7159;">点击“保存当前预览”后会出现在下方列表，可随时删除。</p>
        </div>
      `;
      showToast("预览效果已生成，可以保存到当前界面");
    }

    function saveCurrentPreview() {
      if (!currentGeneratedPreview) {
        showToast("请先生成预览效果");
        return;
      }
      savedPreviews.unshift(currentGeneratedPreview);
      saveLocalData();
      renderSavedPreviewList();
      if (currentPage === "try") {
        const list = document.getElementById("tryPageSavedList");
        if (list) list.innerHTML = renderSavedPreviewsHTML(false);
      }
      showToast("已保存到当前界面");
    }

    function clearCurrentPreview() {
      currentGeneratedPreview = null;
      document.getElementById("previewContainer").innerHTML = `<span style="color:#A58461;">选择纹样和载体后点击生成预览效果</span>`;
      showToast("当前预览已清空");
    }

    function renderSavedPreviewList() {
      const list = document.getElementById("savedPreviewList");
      if (!list) return;
      list.innerHTML = renderSavedPreviewsHTML(true);
    }

    function renderSavedPreviewsHTML(isDrawer) {
      if (savedPreviews.length === 0) {
        return `<div class="empty-box">还没有保存的文创预览</div>`;
      }
      return savedPreviews.map(item => `
        <div class="saved-preview-card">
          <img src="${item.img}" onerror="this.src='${FALLBACK_IMAGE}'">

            <strong>${item.patternName}</strong><br>

          </div>
          <button class="btn-outline" onclick="deleteSavedPreview(${item.id}, ${isDrawer})">删除</button>
        </div>
      `).join("");
    }

    window.deleteSavedPreview = function(id, isDrawer = false) {
      savedPreviews = savedPreviews.filter(item => item.id !== id);
      saveLocalData();
      if (isDrawer) renderSavedPreviewList();
      if (currentPage === "try") {
        const list = document.getElementById("tryPageSavedList");
        if (list) list.innerHTML = renderSavedPreviewsHTML(false);

      const exist = cartItems.find(item => item.id === id);
      if (exist) {
        exist.count += 1;
      } else {
        cartItems.push({ ...product, count: 1 });

      saveLocalData();
      showToast("已加入购物车，可在个人中心查看");
      if (currentPage === "personal") {
        window.navigateTo("personal");

      showToast("已从购物车删除");

    function attachPageEvents() {
      if (currentPage === "library") {
        setTimeout(() => {
          loadPatterns();

          if (filterBtn) {

              let type = document.getElementById("typeFilter").value;
              loadPatterns(nation, type);
            };

        }, 30);

    function bindNavEvents() {
      const navLinks = document.querySelectorAll("#navLinks a[data-nav]");
      navLinks.forEach(link => {
        link.onclick = function(e) {
          e.preventDefault();
          const page = this.getAttribute("data-nav");
          if (page) window.navigateTo(page);
        };
      });
      const logo = document.getElementById("logoHome");
      if (logo) {
        logo.onclick = function(e) {
          e.preventDefault();
          window.navigateTo("home");
        };
      }
    }

    function initAuth() {
      const loginBtn = document.getElementById("loginBtn");
      if (loginBtn) {
        loginBtn.onclick = (e) => {
          e.preventDefault();
          if (currentUser) {
            window.navigateTo("personal");
            return;
          }
          document.getElementById("loginModal").style.display = "flex";
        };
      }
      document.getElementById("confirmLogin").onclick = () => {
        let phone = document.getElementById("phoneInput").value.trim();
        if (!phone) {
          showToast("请输入手机号");
          return;
        }
        currentUser = { name: "文创体验官", role: "user" };
        document.getElementById("loginModal").style.display = "none";
        const authSection = document.getElementById("authSection");
        if (authSection) {
          authSection.innerHTML = `
            <div style="display:flex; gap:8px; align-items:center;">
              <span>👤 ${currentUser.name}</span>
              <a id="personalCenterBtn" style="cursor:pointer;">个人中心</a>
              <a id="logoutBtn" style="cursor:pointer;">退出</a>
            </div>
          `;
          document.getElementById("personalCenterBtn").onclick = () => {
            window.navigateTo("personal");
          };
          document.getElementById("logoutBtn").onclick = () => {
            currentUser = null;
            location.reload();
          };
        }
        document.getElementById("msgIcon").style.display = "inline-block";
        showToast("登录成功！可在个人中心查看购物车");
      };
      document.getElementById("closeModal").onclick = () => {
        document.getElementById("loginModal").style.display = "none";
      };
    }

    function initFooter() {
      document.getElementById("footerUpload").onclick = (e) => { e.preventDefault(); uploadPatternAction(); };
      document.getElementById("footerAbout").onclick = (e) => { e.preventDefault(); showToast("关于我们：云南非遗数字化保护平台，传承民族文化"); };
      document.getElementById("footerLicense").onclick = (e) => { e.preventDefault(); showToast("纹样授权协议：传统纹样展示用于文化传播，商用需遵循授权规范"); };
      document.getElementById("footerJoin").onclick = (e) => { e.preventDefault(); showToast("加入我们：设计师、研究者、传承人可共同参与纹样整理与传播"); };
    }

    function initTrial() {
      document.getElementById("closeDrawer").onclick = closeDrawer;
      document.getElementById("drawerOverlay").onclick = closeDrawer;
      document.getElementById("renderMockupBtn").onclick = generateEffect;
      document.getElementById("savePreviewBtn").onclick = saveCurrentPreview;
      document.getElementById("clearPreviewBtn").onclick = clearCurrentPreview;
      document.querySelectorAll(".product-template").forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          currentTemplate = btn.getAttribute("data-product");
          showToast(`已切换载体：${currentTemplate}`);
        };
      });
    }

    function initSearch() {
      const searchInput = document.getElementById("globalSearch");
      if (searchInput) {
        searchInput.onkeypress = (e) => {
          if (e.key === "Enter") {
            const keyword = e.target.value.trim();
            if (!keyword) { showToast("请输入搜索关键词"); return; }
            const result = mockPatterns.filter(p => {
              return p.name.includes(keyword) || p.nation.includes(keyword) || p.type.includes(keyword) || p.desc.includes(keyword);
            });
            renderSearchResult(keyword, result);
          }
        };
      }
    }

    function renderSearchResult(keyword, result) {
      const html = `
        <div class="container" style="margin-top:32px;">
          <h2>搜索结果：${keyword}</h2>
          <p style="margin-top:8px; color:#6B5642;">共找到 ${result.length} 个相关纹样。</p>
          <div class="grid-4" style="margin-top:24px;">
            ${result.length ? result.map(p => renderPatternCard(p)).join("") : `<div class="empty-box">暂无相关纹样</div>`}
          </div>
        </div>
      `;
      document.getElementById("appContent").innerHTML = html;
      window.scrollTo(0, 0);
    }

    function init() {
      bindNavEvents();
      initAuth();
      initFooter();
      initTrial();
      initSearch();
      window.navigateTo("home");
    }

    init();
  </script>
</body>
</html>
